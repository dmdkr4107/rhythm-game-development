name: Validate rhythm game

on:
  push:
  pull_request:

jobs:
  static-checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check JavaScript syntax
        run: |
          node --check assets/js/game.js
          node --check assets/js/firebase.js
      - name: Check required files and HTML references
        run: node tests/static-check.mjs
